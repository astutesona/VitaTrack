name: vitatrack
description: "VitaTrack – Personal Health & Wellness Tracker. An MCA Level Advanced Mobile Application Development Project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Local Persistence
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Data Visualization & Charts
  fl_chart: ^0.69.0

  # Device Hardware / Sensor Step Tracking
  pedometer: ^4.0.1
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
